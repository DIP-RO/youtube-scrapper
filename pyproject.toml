[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "yt-network-scraper"
version = "1.0.3"
description = "A network-first YouTube video scraper that extracts metadata, transcripts, comments, and summaries from captured network payloads."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dipro Paul", email = "dipropaul032@gmail.com" },
]
keywords = [
    "youtube",
    "scraper",
    "transcript",
    "comments",
    "metadata",
    "selenium",
    "network",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
    "selenium>=4.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
yt-network-scraper = "yt_network_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/DIP-RO/youtube-scrapper"
Repository = "https://github.com/DIP-RO/youtube-scrapper"
Issues = "https://github.com/DIP-RO/youtube-scrapper/issues"
Changelog = "https://github.com/DIP-RO/youtube-scrapper/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_network_scraper"]

[tool.hatch.build.targets.sdist]
include = [
    "src/yt_network_scraper",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "docs/images/*.svg",
    "docs/images/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/yt_network_scraper"]

[tool.coverage.report]
show_missing = true
