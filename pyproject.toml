[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "media-data-extractor"
version = "4.0.0"
description = "Extract metadata, transcripts, comments, sentiment, and video files from YouTube. Includes video player, playlist management, and research pipeline."
readme = "README_PYPY.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dipro Paul" },
]
keywords = [
    "youtube",
    "youtube-scraper",
    "youtube-downloader",
    "youtube-transcript",
    "youtube-comments",
    "youtube-metadata",
    "youtube-api",
    "youtube-extractor",
    "media-data-extractor",
    "video-downloader",
    "video-player",
    "transcript",
    "comments",
    "sentiment-analysis",
    "selenium",
    "scraper",
    "data-extraction",
    "media-extraction",
    "research",
    "pipeline",
    "playlist",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
    "selenium>=4.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
media-data-extractor = "media_data_extractor.cli:main"
mdx = "media_data_extractor.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/media-data-extractor/"
Changelog = "https://pypi.org/project/media-data-extractor/#history"

[tool.hatch.build.targets.wheel]
packages = ["src/media_data_extractor"]

[tool.hatch.build.targets.sdist]
include = [
    "src/media_data_extractor",
    "tests",
    "examples",
    "README.md",
    "README_PYPY.md",
    "LICENSE",
    "CHANGELOG.md",
    "Dockerfile",
    "docker-compose.yml",
    ".dockerignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/media_data_extractor"]

[tool.coverage.report]
show_missing = true
